services:
  php:
    container_name: apache_php_xdebug
    image: alaugks/apache-php:local-xdebug
    build:
      dockerfile: Dockerfile
      context: .
      target: xdebug
    volumes:
      - ./app:/var/www/app
    ports:
      - "8080:80"
    environment:
      PHP_IDE_CONFIG: "serverName=localhost"
      XDEBUG_CONFIG: "idekey=apache_php_xdebug"
