version: 2
updates:
  # Branch 8.5 (Default): only PHP 8.5.x
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Branch 8.4: only PHP 8.4.x
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "8.4"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "8.4"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
