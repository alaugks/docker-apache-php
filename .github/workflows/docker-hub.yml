#            ENABLE_XDEBUG=1
#          load: true
#          tags: alaugks/apache-php:${{github.ref_name}}-xdebug
#
#      - name: Test run image (with XDebug)
#        run: |
#          docker run \
#            -p 8080:80 \
#            --rm alaugks/apache-php:${{github.ref_name}}-xdebug

      - name: Build and push (with XDebug)
        uses: docker/build-push-action@v7.4.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            ENABLE_XDEBUG=1
          push: true
          tags: alaugks/apache-php:${{github.ref_name}}-xdebug

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: alaugks/apache-php:${{github.ref_name}}
